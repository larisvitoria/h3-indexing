[project]
name = "h3-indexing"
version = "0.1.0"
description = "Agregação de camadas vetoriais em grade hexagonal H3"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "geopandas>=0.14",
    "h3>=4.1",
    "shapely>=2.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "pyproj>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
h3-indexing = "h3_indexing.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
